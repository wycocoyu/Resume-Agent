name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'codex/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-check:
    name: Changelog Date & SemVer Governance (#52)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify CHANGELOG pure-date & semver format
        run: node scripts/check-changelog.mjs

  frontend-and-packages:
    name: TypeScript Packages & Frontend Build / Test (#63)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and Typecheck Packages
        run: |
          mkdir -p node_modules/@cococv
          ln -sfn ../../packages/schema node_modules/@cococv/schema
          ln -sfn ../../packages/proxy node_modules/@cococv/proxy
          cd packages/schema && ../../frontend/node_modules/.bin/tsc
          cd ../proxy && ../../frontend/node_modules/.bin/tsc

      - name: Run Schema & Proxy Contract Tests
        run: |
          ./frontend/node_modules/.bin/vitest run packages/schema/tests/schema.test.ts
          ./frontend/node_modules/.bin/vitest run packages/proxy/tests/proxy.test.ts

      - name: Run Frontend Vitest Suite
        working-directory: frontend
        run: npm test -- --run

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  backend-tests:
    name: Backend Pytest & XeLaTeX Zero-Regression (#62)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install XeLaTeX & Chinese CJK Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-lang-chinese \
            fonts-noto-cjk \
            fonts-wqy-zenhei

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Targeted M2 Tests (XeLaTeX CMap, Rebranding CLI, Storage Compat)
        run: |
          pytest backend/tests/test_latex_compiler.py \
                 tests/e2e/tier1/test_xelatex_tounicode_cmap.py \
                 tests/e2e/tier1/test_rebranding_dual_cli.py \
                 tests/e2e/tier1/test_storage_compat_migration.py \
                 backend/tests/test_pi_core_architecture.py -v

      - name: Run Full Backend Test Suite
        run: |
          pytest backend/tests/ -k "not test_admin_pdf_remote" -q
