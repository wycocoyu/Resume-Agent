schema_version = 1
id = "workbuddy"
display_name = "WorkBuddy"
# experimental: WorkBuddy's skill discovery directory and metadata format are not
# confirmed. Generation works, installation requires an explicit --path.
status = "experimental"
invoke_syntax = "/resume-agent"
cli_min_version = "0.1.0"
notes = "Discovery directory unverified; pass --path <dir> to skill install."

[frontmatter]
name = "resume-agent"
description = "long"

[constraints]
description_min = 20
description_max = 1024

[[assets]]
from = "core/body.md"
to = "SKILL.md"
mode = "skill"

[[assets]]
from = "core/references/schema.md"
to = "references/schema.md"
mode = "schema"

[install]
scope_default = "user"
strategy = "copy"
user_paths = []
project_paths = []
