schema_version = 1
id = "pi"
display_name = "pi"
# experimental: paths and the /skill:<name> command syntax follow the official
# docs (https://pi.dev/docs/latest/skills) and were cross-checked against the
# pi 1.5.2 source (user skills = <agentDir>/skills with agentDir = ~/.pi/agent;
# project = <cwd>/.pi/skills). Discovery, SKILL.md parsing, and the authoring
# workflow were verified live (loadSkills API + interactive skill listing +
# a pi-driven resume.json that passed validate); the in-session render step is
# pending a non-rate-limited run. pi implements the Agent Skills specification:
# name <= 64 chars (lowercase/numbers/hyphens), description <= 1024 chars.
status = "experimental"
invoke_syntax = "/skill:resume-agent"
cli_min_version = "0.1.0"
notes = "pi also discovers the Agent Skills location ~/.agents/skills (and project .agents/skills) natively."

[frontmatter]
name = "resume-agent"
description = "long"

[constraints]
description_min = 20
description_max = 1024

[[assets]]
from = "core/body.md"
to = "SKILL.md"
mode = "skill"

[[assets]]
from = "core/references/schema.md"
to = "references/schema.md"
mode = "schema"

[install]
scope_default = "user"
strategy = "copy"
user_paths = ["~/.pi/agent/skills", "~/.agents/skills"]
project_paths = [".pi/skills", ".agents/skills"]
