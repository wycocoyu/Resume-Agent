# Curated notes for the top-level ResumeData table.
# Facts (field name, type, required/optional) are generated from
# backend/cli/schema.py; only the human wording lives here. A new model field
# without a note fails `resume-agent skill build` on purpose.

[notes]
id = 'e.g. `"resume_1730000000000"` or UUID'
title = 'Workspace document title, e.g. `"我的简历"`'
createdAt = 'ISO-8601 timestamp'
updatedAt = 'ISO-8601 timestamp'
templateId = 'Keep `null` for standard LaTeX template'
basic = 'Candidate header & contact info'
education = 'Education entries'
experience = 'Internship entries (`实习经历`)'
projects = 'Project entries (`项目经历`)'
openSource = 'Open-source entries (`开源经历`)'
awards = 'Honors & awards (`荣誉奖项`)'
customData = 'Keyed by `custom_*` section ID (e.g. `custom_research`)'
selfEvaluation = 'Summary / self-evaluation (`自我评价`)'
skillContent = 'Technical skills (`专业技能`)'
activeSection = 'Active UI tab, default `"basic"`'
draggingProjectId = 'Keep `null`'
menuSections = 'Controls section titles, enabled flags, and PDF section order'
globalSettings = 'Typography, spacing, and LaTeX layout settings'
templateType = 'Default `"latex"`. Note: CLI always renders via LaTeX and emits a warning if `"html"`'
alias = 'Optional workspace remark/tag'
workExperience = 'Full-time work experience (`工作经历`), separate from `experience` (`实习经历`)'
