# ============================================================
# Resume-Agent 前端 Nginx 配置
# - SPA 路由回退到 index.html
# - /api/ 反向代理到 backend 容器（compose 服务名解析）
# - SSE 流式接口（/api/agent/stream、/api/pdf/render/stream）关键配置：
#   关闭代理缓冲，保证 token 级实时推送
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 简历 PDF / 图片上传导入需要放行大请求体
    client_max_body_size 50m;

    # gzip 压缩静态资源
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Vite 构建产物带内容哈希，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由：刷新/直达任意前端路由均回退到 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API
    location /api/ {
        proxy_pass http://backend:9000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- SSE 流式关键配置（/api/agent/stream、/api/pdf/render/stream 等）---
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
