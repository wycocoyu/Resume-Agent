[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-agent"
version = "0.1.0"
description = "Resume-Agent CLI and backend utilities"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "PyMuPDF>=1.24.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
resume-agent = "backend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
# Skill templates are the single authoritative source rendered into every
# harness skill directory; they must ship inside the wheel so that
# `resume-agent skill install` works after a plain `pip install`.
backend = ["skill_templates/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
