[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-agent"
version = "0.1.0"
description = "Resume-Agent CLI and backend utilities"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "PyMuPDF>=1.24.0",
]

[project.scripts]
resume-agent = "backend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
